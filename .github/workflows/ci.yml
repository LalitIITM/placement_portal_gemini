name: CI Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend (Ruff + Alembic + Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placement_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: placement_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://placement_user:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/placement_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-prod
        run: alembic upgrade head

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://placement_user:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/placement_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-prod
        run: pytest

  frontend-ci:
    name: Frontend (Typecheck + Vite Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Production Build
        run: npm run build

  fullstack-e2e-ui:
    name: Full-Stack Multi-Role Playwright E2E
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: placement_user
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: placement_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies & run migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://placement_user:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/placement_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-prod
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          alembic upgrade head

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend & Playwright Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright Multi-Role E2E Suite (all 5 roles)
        working-directory: frontend
        env:
          DATABASE_URL: postgresql+asyncpg://placement_user:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/placement_test_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci-test-secret-key-not-for-prod
          LIVE_FRONTEND_URL: http://127.0.0.1:5173
          LIVE_BACKEND_URL: http://127.0.0.1:8000
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
